# Production profile. Every development convenience is off, and ProdGuard refuses to start if any of these
# values is missing or still points at a development default. Placeholders default to blank on purpose so the
# guard, not a placeholder-resolution error, reports what is missing.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_JWT_ISSUER_URI:}
          audiences: ${APP_JWT_AUDIENCE:}

server:
  # TLS terminates at the load balancer. X-Forwarded-For / X-Forwarded-Proto are honoured only from the addresses
  # in internal-proxies, so the audit trail records the real client address and HSTS is sent on https requests.
  # Link URLs still come from APP_PUBLIC_BASE_URL, never from forwarded Host headers.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      # Required (ProdGuard checks it): a regex of the load balancer's addresses.
      internal-proxies: ${SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES:}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  security:
    audience: ${APP_JWT_AUDIENCE:}
  crypto:
    kek: ${APP_CRYPTO_KEK:}
    dev-fallback-allowed: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: ecs
  level:
    dev.rambally: INFO
