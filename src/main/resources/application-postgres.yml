spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/statements}
    username: ${SPRING_DATASOURCE_USERNAME:statements}
    password: ${SPRING_DATASOURCE_PASSWORD:statements}
    hikari:
      maximum-pool-size: 10
      # Fail fast when the database is down rather than holding a request thread for 30 seconds.
      connection-timeout: 3000
