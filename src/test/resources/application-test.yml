spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

app:
  public-base-url: https://statements.example.test
  storage:
    root: ${java.io.tmpdir}/secure-statements-test/${random.uuid}
  crypto:
    # Fixed 32-byte test key (base64 of "test-kek-test-kek-test-kek-test!")
    kek: dGVzdC1rZWstdGVzdC1rZWstdGVzdC1rZWstdGVzdCE=
    kek-id: test-kek
    dev-fallback-allowed: false
