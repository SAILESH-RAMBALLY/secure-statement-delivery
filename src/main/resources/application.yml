spring:
  application:
    name: secure-statement-delivery
  mvc:
    problemdetails:
      enabled: true
    log-request-details: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false
    # Let Tomcat drain an oversize upload so the client receives the 413 instead of a connection reset.
    max-swallow-size: 12MB
    threads:
      # Sized with the download bulkhead: at most 16 downloads x ~20 MiB in flight against a 1 GiB container.
      max: 48
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-path: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        readiness:
          # The container is only "ready" when the database answers; liveness stays independent of it.
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    roles-claim: roles
    audience: secure-statements
    dev-issuer: http://localhost:8080/dev
  storage:
    root: ${APP_DATA_DIR:./data}/statements
  crypto:
    kek: ${APP_CRYPTO_KEK:}
    kek-id: ${APP_CRYPTO_KEK_ID:local-kek-v1}
    dev-fallback-allowed: false
  statement:
    max-size-bytes: 10485760
  link:
    ttl: ${APP_LINK_TTL:PT24H}
    max-downloads: ${APP_LINK_MAX_DOWNLOADS:1}
  download:
    max-concurrent: ${APP_DOWNLOAD_MAX_CONCURRENT:16}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
