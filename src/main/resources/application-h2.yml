# Standalone profile: file-based H2 under APP_DATA_DIR so a single `docker run` works without compose.
spring:
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/db/statements;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
# The H2 web console module (spring-boot-h2console) is deliberately not a dependency.
