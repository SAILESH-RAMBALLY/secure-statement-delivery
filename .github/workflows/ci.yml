name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit and integration tests (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify

      - name: Build container image
        run: docker build -t secure-statements:ci .

      - name: Run the image with the compose hardening and drive the full smoke flow
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 secure-statements:ci
          scripts/smoke.sh http://127.0.0.1:8080

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/
