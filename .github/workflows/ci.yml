name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit and integration tests
        run: ./mvnw -B verify

      - name: Build the image
        run: docker build -t secure-statements:ci .

      - name: Smoke test the standalone image (read-only, no capabilities)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 secure-statements:ci
          scripts/smoke.sh http://127.0.0.1:8080
          docker rm -f smoke

      - name: The image refuses to start in prod with nothing configured
        run: |
          set +e
          docker run --rm -e SPRING_PROFILES_ACTIVE=prod secure-statements:ci > prod.log 2>&1
          code=$?
          set -e
          cat prod.log | tail -20
          test "$code" -ne 0
          grep -q "Refusing to start in prod" prod.log

      - name: Smoke test the compose stack with PostgreSQL (no .env file)
        run: |
          test ! -f .env
          docker compose config -q
          docker compose up -d --build --wait
          scripts/smoke.sh http://127.0.0.1:8080

      - name: Logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker compose logs || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f smoke || true
          docker compose down -v || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco
          path: target/site/jacoco/
