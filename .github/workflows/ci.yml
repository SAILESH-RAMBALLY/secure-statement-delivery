name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit and integration tests (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify

      - name: Build container image
        run: docker build -t secure-statements:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 secure-statements:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/
