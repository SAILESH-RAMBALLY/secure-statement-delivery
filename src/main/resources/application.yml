spring:
  application:
    name: secure-statement-delivery
  mvc:
    problemdetails:
      enabled: true
    log-request-details: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    validate-on-migrate: true

server:
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-path: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    roles-claim: roles
    audience: secure-statements
    dev-issuer: http://localhost:8080/dev
  storage:
    root: ${APP_DATA_DIR:./data}/statements
  crypto:
    kek: ${APP_CRYPTO_KEK:}
    kek-id: ${APP_CRYPTO_KEK_ID:local-kek-v1}
    dev-fallback-allowed: false
  statement:
    max-size-bytes: 10485760

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
